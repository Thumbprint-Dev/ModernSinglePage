<!-- One-product mode (SingleProductCtrl). Gallery left, sticky details right; options come from
     the product's own Four51 spec form, the same one the quick-add modal and product page use. -->
<loadingindicator ng-show="singleLoading"></loadingindicator>

<div class="msp-single" ng-if="LineItem.Product && !singleLoading">
    <div class="msp-single-gallery" ng-controller="LightboxCtrl">
        <button type="button" class="msp-card-fav" ng-if="user.Type == 'Customer'"
                ng-click="$root.isFavorite(LineItem.Product.InteropID) ? $root.removeFavorite(LineItem.Product.InteropID) : $root.addFavorite(LineItem.Product.InteropID)"
                aria-label="{{($root.isFavorite(LineItem.Product.InteropID) ? 'Remove from favorites' : 'Add to favorites') | r | xlat}}"
                aria-pressed="{{!!$root.isFavorite(LineItem.Product.InteropID)}}">
            <svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"
                 ng-attr-fill="{{$root.isFavorite(LineItem.Product.InteropID) ? 'currentColor' : 'none'}}"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg>
        </button>
        <productlightbox></productlightbox>
    </div>

    <div class="msp-single-info">
        <p class="msp-eyebrow" ng-if="site.shop.heading">{{site.shop.heading | r | xlat}}</p>
        <h3 class="msp-single-name">{{LineItem.Product.Name}}</h3>
        <p class="msp-single-price" ng-if="LineItem.PriceSchedule.PriceBreaks[0] && !(user.Permissions.contains('HidePricing'))">
            <span ng-if="LineItem.PriceSchedule.PriceBreaks.length > 1">{{'From' | r | xlat}}</span>
            {{LineItem.PriceSchedule.PriceBreaks[0].Price | culturecurrency}}
        </p>
        <div class="msp-single-desc" ng-if="LineItem.Product.Description" ng-bind-html="trustedDescription(LineItem.Product)"></div>

        <!-- Kits, VariableText and anything else the inline flow can't handle: the full page. -->
        <div ng-if="needsFullPdp" class="msp-single-options">
            <p class="msp-card-note">{{'This item has options to choose on its product page.' | r | xlat}}</p>
            <a class="msp-btn msp-btn-accent msp-btn-block" ng-href="{{productPageUrl()}}">{{'Choose options' | r | xlat}}</a>
        </div>

        <form ng-if="!needsFullPdp" name="singleAddForm" novalidate class="msp-single-options" ng-submit="addSingleToCart()">
            <kitaddtoorderspecs template="{{LineItem.Product.InteropID}}"></kitaddtoorderspecs>

            <div class="msp-single-buy">
                <div class="msp-single-qty">
                    <label>{{'Quantity' | r | xlat}}</label>
                    <quantityfield lineitem="LineItem" required="true" class="quantity"></quantityfield>
                </div>
                <button type="submit" class="msp-btn msp-btn-accent msp-single-add" ng-disabled="addToOrderIndicator">
                    <i ng-show="addToOrderIndicator" class="fa fa-spinner fa-spin" aria-hidden="true"></i>
                    {{'Add to cart' | r | xlat}}<span ng-if="LineItem.LineTotal && !(user.Permissions.contains('HidePricing'))"> &mdash; {{LineItem.LineTotal | culturecurrency}}</span>
                </button>
            </div>

            <ul class="msp-single-errors" role="alert" ng-show="addAttempted && lineItemErrors.length">
                <li ng-repeat="e in lineItemErrors">{{e | xlat}}</li>
            </ul>
            <p class="msp-card-note msp-card-error" role="alert" ng-show="errorMessage">{{errorMessage}}</p>
        </form>
    </div>
</div>
